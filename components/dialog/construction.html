<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-dialog — Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<script src="../button/button.js" defer></script>
<script src="dialog.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<style>
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
  /* A dialog is fixed over the viewport. `contained` scopes it to the nearest
     positioned ancestor instead, so each preview box holds one open dialog and
     the construction page stays scrollable and tabbable. */
  .dialog-stage {
    position: relative;
    height: 19rem;
    overflow: hidden;
    border-radius: 12px;
    background: var(--kakao-color-page);
    /* the panel fits the stage instead of 85% of the window */
    --kakao-dialog-max-height: 100%;
  }
</style>
</head>
<body>
<kakao-theme-switch class="page-theme-switch"></kakao-theme-switch>
<main data-construction data-target="dialog" data-source="dialog.js" data-title="Dialog">
  <div class="construction-preview">
    <figure>
      <figcaption>Header, body, footer</figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained label="Example dialog">
          <h2 slot="header">Example dialog</h2>
          <p>The panel, the covered page and the sizing all follow the settings in <code>dialog.js</code>.</p>
          <div slot="footer">
            <kakao-button label="Cancel" variant="ghost" data-close="cancel"></kakao-button>
            <kakao-button label="Save" data-close="save"></kakao-button>
          </div>
        </kakao-dialog>
      </div>
    </figure>
    <figure>
      <figcaption>Danger · confirm pattern · <code>size="sm"</code></figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained size="sm" label="Delete?">
          <h2 slot="header">Delete project?</h2>
          <p>This cannot be undone.</p>
          <div slot="footer">
            <kakao-button label="Keep it" variant="ghost" data-close="cancel"></kakao-button>
            <kakao-button label="Delete" variant="danger" data-close="delete"></kakao-button>
          </div>
        </kakao-dialog>
      </div>
    </figure>
    <figure>
      <figcaption>No header · <code>label</code> only</figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained label="No header here">
          <p>Without a header element the <code>label</code> attribute is the accessible name.</p>
          <div slot="footer"><kakao-button label="Got it" variant="ghost" data-close="ok"></kakao-button></div>
        </kakao-dialog>
      </div>
    </figure>
    <figure>
      <figcaption>Large · <code>size="lg"</code></figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained size="lg" label="Large">
          <h2 slot="header">Large panel</h2>
          <p>42rem wide, or the width of the box it sits in, whichever is smaller.</p>
          <div slot="footer"><kakao-button label="Close" variant="ghost" data-close="close"></kakao-button></div>
        </kakao-dialog>
      </div>
    </figure>
    <figure>
      <figcaption>Centred · <code>button-position="center"</code></figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained size="sm" button-position="center" label="Centred buttons">
          <h2 slot="header">Save changes?</h2>
          <p>The footer buttons sit in the middle; no corner holds a button.</p>
          <div slot="footer">
            <kakao-button label="Discard" variant="ghost" data-close="discard"></kakao-button>
            <kakao-button label="Save" data-close="save"></kakao-button>
          </div>
        </kakao-dialog>
      </div>
    </figure>
    <figure>
      <figcaption>Full width · <code>full-width</code></figcaption>
      <div class="dialog-stage">
        <kakao-dialog open contained size="sm" full-width label="Full width buttons">
          <h2 slot="header">Delete project?</h2>
          <p>The buttons split the width; both bottom corners round to match.</p>
          <div slot="footer">
            <kakao-button label="Keep it" variant="secondary" data-close="cancel"></kakao-button>
            <kakao-button label="Delete" variant="danger" data-close="delete"></kakao-button>
          </div>
        </kakao-dialog>
      </div>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-dialog-scrim", "label": "Covered page", "group": "Colour", "type": "color" },
    { "property": "--kakao-dialog-bg", "label": "Background", "group": "Colour", "type": "color" },
    { "property": "--kakao-dialog-text", "label": "Text", "group": "Colour", "type": "color" },
    { "property": "--kakao-dialog-focus", "label": "Focus outline", "group": "Colour", "type": "color" },

    { "property": "--kakao-dialog-padding", "label": "Padding", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-gap", "label": "Gap", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-footer-gap", "label": "Footer gap", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-footer-spacing", "label": "Space above footer", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-max-height", "label": "Max height", "group": "Size & spacing", "type": "length", "hint": "the body scrolls past it" },
    { "property": "--kakao-dialog-width-sm", "label": "Width sm", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-width-md", "label": "Width md", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-dialog-width-lg", "label": "Width lg", "group": "Size & spacing", "type": "length" },

    { "property": "--kakao-dialog-radius", "label": "Radius", "group": "Shape", "type": "radius", "hint": "a bottom corner holding a filled footer button (not ghost) gets button radius + padding" },
    { "property": "--kakao-dialog-shadow", "label": "Shadow", "group": "Shape", "type": "shadow" },
    { "property": "--kakao-dialog-z", "label": "Z-index", "group": "Shape", "type": "number", "min": 0, "max": 9999 },

    { "property": "--kakao-dialog-title-size", "label": "Title size", "group": "Typography", "type": "length" },
    { "property": "--kakao-dialog-title-weight", "label": "Title weight", "group": "Typography", "type": "number", "min": 100, "max": 900, "step": 50 },

    { "property": "--kakao-dialog-duration", "label": "Duration", "group": "Motion", "type": "duration" },
    { "property": "--kakao-dialog-easing", "label": "Easing", "group": "Motion", "type": "easing" }
  ]
  </script>
</main>
</body>
</html>
