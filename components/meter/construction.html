<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-meter - Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<script src="../button/button.js" defer></script>
<script src="meter.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<style>
  .bars { display: grid; gap: 1rem; }
  .bars .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
</style>
<script src="../header-bar/header-bar.js" defer></script>
</head>
<body>
<kakao-header-bar>
  <kakao-theme-switch slot="end"></kakao-theme-switch>
</kakao-header-bar>
<main data-construction data-target="meter" data-source="meter.js" data-title="Meter">
  <div class="construction-preview">
    <figure>
      <figcaption>Regions and fill</figcaption>
      <div class="bars">
        <kakao-meter id="cx-play" label="Storage" max="100" low="30" high="80" optimum="20" value="18" show-value></kakao-meter>
        <div class="row">
          <kakao-button data-value="18" label="18" size="sm" variant="secondary"></kakao-button>
          <kakao-button data-value="55" label="55" size="sm" variant="secondary"></kakao-button>
          <kakao-button data-value="92" label="92" size="sm" variant="secondary"></kakao-button>
        </div>
      </div>
    </figure>
    <figure>
      <figcaption>Sizes and colours</figcaption>
      <div class="bars">
        <kakao-meter size="sm" label="Small, good" value="0.45" show-value></kakao-meter>
        <kakao-meter label="Medium, so-so" low="0.3" high="0.7" optimum="0.1" value="0.6" show-value></kakao-meter>
        <kakao-meter size="lg" label="Large, bad" low="0.3" high="0.7" optimum="0.1" value="0.9" show-value></kakao-meter>
      </div>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-meter-track", "label": "Track", "group": "Colour", "type": "color" },
    { "property": "--kakao-meter-success", "label": "Good fill", "group": "Colour", "type": "color", "hint": "optimum region" },
    { "property": "--kakao-meter-warning", "label": "So-so fill", "group": "Colour", "type": "color", "hint": "suboptimal region" },
    { "property": "--kakao-meter-danger", "label": "Bad fill", "group": "Colour", "type": "color", "hint": "even-less-good region" },
    { "property": "--kakao-meter-label-color", "label": "Label", "group": "Colour", "type": "color" },
    { "property": "--kakao-meter-value-color", "label": "Value text", "group": "Colour", "type": "color" },
    { "property": "--kakao-meter-height", "label": "Bar height", "group": "Size & spacing", "type": "length", "hint": "md" },
    { "property": "--kakao-meter-sm-height", "label": "Bar height sm", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-meter-lg-height", "label": "Bar height lg", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-meter-label-gap", "label": "Label gap", "group": "Size & spacing", "type": "length", "hint": "label row to bar" },
    { "property": "--kakao-meter-font-size", "label": "Font size", "group": "Typography", "type": "length", "hint": "md" },
    { "property": "--kakao-meter-sm-font-size", "label": "Font size sm", "group": "Typography", "type": "length" },
    { "property": "--kakao-meter-lg-font-size", "label": "Font size lg", "group": "Typography", "type": "length" },
    { "property": "--kakao-meter-label-weight", "label": "Label weight", "group": "Typography", "type": "number", "min": 300, "max": 800, "step": 50 },
    { "property": "--kakao-meter-radius", "label": "Radius", "group": "Shape", "type": "radius" },
    { "property": "--kakao-meter-fill-duration", "label": "Fill", "group": "Motion", "type": "duration", "hint": "length only; the colour switches at once" },
    { "property": "--kakao-meter-fill-ease", "label": "Fill easing", "group": "Motion", "type": "easing" }
  ]
  </script>
</main>
<script>
  customElements.whenDefined('kakao-meter').then(() => {
    const bar = document.getElementById('cx-play');
    document.querySelectorAll('[data-value]').forEach((b) => b.addEventListener('kakao-button-action', () => { bar.value = b.dataset.value; }));
  });
</script>
</body>
</html>
