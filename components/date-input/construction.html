<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-date-input - Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<script src="../button/button.js" defer></script>
<script src="date-input.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<script src="../header-bar/header-bar.js" defer></script>
</head>
<body>
<kakao-header-bar>
  <kakao-theme-switch slot="end"></kakao-theme-switch>
</kakao-header-bar>
<main data-construction data-target="date-input" data-source="date-input.js" data-title="Date input">
  <div class="construction-preview">
    <figure>
      <figcaption>Date · time · hint</figcaption>
      <div style="display:grid;gap:.5rem">
        <kakao-date-input label="Start" value="2026-03-04" hint="The browser's own field and picker"></kakao-date-input>
        <kakao-date-input type="time" label="At" value="14:30"></kakao-date-input>
      </div>
    </figure>
    <figure>
      <figcaption>Date and time · month</figcaption>
      <div style="display:grid;gap:.5rem">
        <kakao-date-input type="datetime-local" label="Meeting" value="2026-03-04T14:30"></kakao-date-input>
        <kakao-date-input type="month" label="Month" value="2026-03"></kakao-date-input>
      </div>
    </figure>
    <figure>
      <figcaption>Sizes · error</figcaption>
      <div style="display:grid;gap:.5rem">
        <kakao-date-input size="sm" value="2026-03-04" aria-label="Small"></kakao-date-input>
        <kakao-date-input size="lg" value="2026-03-04" aria-label="Large"></kakao-date-input>
        <kakao-date-input type="time" value="11:00" error="Check-in starts at 15:00" aria-label="Check-in"></kakao-date-input>
      </div>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-date-input-bg", "label": "Field background", "group": "Colour", "type": "color" },
    { "property": "--kakao-date-input-text", "label": "Text", "group": "Colour", "type": "color", "hint": "also the picker icon in Firefox" },
    { "property": "--kakao-date-input-muted", "label": "Muted text", "group": "Colour", "type": "color", "hint": "hint, placeholder, picker icon (Chromium)" },
    { "property": "--kakao-date-input-border", "label": "Field border", "group": "Colour", "type": "color" },
    { "property": "--kakao-date-input-focus", "label": "Focus", "group": "Colour", "type": "color" },
    { "property": "--kakao-date-input-danger", "label": "Danger", "group": "Colour", "type": "color" },

    { "property": "--kakao-date-input-font", "label": "Font", "group": "Typography", "type": "font" },
    { "property": "--kakao-date-input-label-weight", "label": "Label weight", "group": "Typography", "type": "number", "min": 100, "max": 900, "step": 50 },

    { "property": "--kakao-date-input-height", "label": "Height (md)", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-date-input-padding-x", "label": "Padding x", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-date-input-label-gap", "label": "Label gap", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-date-input-message-gap", "label": "Message gap", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-date-input-icon-size", "label": "Picker icon size", "group": "Size & spacing", "type": "length", "hint": "Chromium only; centred where the select's chevron is" },
    { "property": "--kakao-date-input-moz-nudge", "label": "Firefox icon nudge", "group": "Size & spacing", "type": "length", "hint": "moves Firefox's own picker button onto the chevron's line" },
    { "property": "--kakao-date-input-focus-width", "label": "Focus width", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-date-input-focus-offset", "label": "Focus offset", "group": "Size & spacing", "type": "length" },

    { "property": "--kakao-date-input-radius", "label": "Field radius", "group": "Shape", "type": "radius" },

    { "property": "--kakao-date-input-disabled-opacity", "label": "Disabled opacity", "group": "Effects", "type": "number", "min": 0, "max": 1, "step": 0.05 },

    { "property": "--kakao-date-input-duration", "label": "Border fade", "group": "Motion", "type": "duration" },
    { "property": "--kakao-date-input-ease", "label": "Easing", "group": "Motion", "type": "easing", "hint": "standard: colour" }
  ]
  </script>
</main>
</body>
</html>
