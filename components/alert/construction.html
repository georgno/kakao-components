<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-alert - Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<script src="../button/button.js" defer></script>
<script src="alert.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<style>
  .alerts { display: grid; gap: 0.75rem; }
</style>
<script src="../header-bar/header-bar.js" defer></script>
</head>
<body>
<kakao-header-bar>
  <kakao-theme-switch slot="end"></kakao-theme-switch>
</kakao-header-bar>
<main data-construction data-target="alert" data-source="alert.js" data-title="Alert">
  <div class="construction-preview">
    <figure>
      <figcaption>Tones</figcaption>
      <div class="alerts">
        <kakao-alert duration="0">A new version is available.</kakao-alert>
        <kakao-alert tone="success" duration="0">Settings saved.</kakao-alert>
        <kakao-alert tone="warning" duration="0" heading="Your trial ends in 3 days">Add a payment method to keep your projects.</kakao-alert>
        <kakao-alert tone="danger" duration="0" heading="Payment failed" dismissible>Your card was declined. Update it and try again.</kakao-alert>
      </div>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-alert-surface", "label": "Surface (tint base)", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-text", "label": "Text", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-info", "label": "Info", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-success", "label": "Success", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-warning", "label": "Warning", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-danger", "label": "Danger", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-focus", "label": "Focus ring", "group": "Colour", "type": "color" },
    { "property": "--kakao-alert-tint", "label": "Tint", "group": "Colour", "type": "percent", "hint": "tone colour in the fill" },
    { "property": "--kakao-alert-border-mix", "label": "Border mix", "group": "Colour", "type": "percent", "hint": "tone colour in the border" },
    { "property": "--kakao-alert-icon-mix", "label": "Icon mix", "group": "Colour", "type": "percent", "hint": "tone colour in the icon" },
    { "property": "--kakao-alert-padding-y", "label": "Padding y", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-alert-padding-x", "label": "Padding x", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-alert-gap", "label": "Gap", "group": "Size & spacing", "type": "length", "hint": "icon to text" },
    { "property": "--kakao-alert-icon-size", "label": "Icon size", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-alert-font-size", "label": "Font size", "group": "Typography", "type": "length" },
    { "property": "--kakao-alert-title-weight", "label": "Title weight", "group": "Typography", "type": "number" },
    { "property": "--kakao-alert-radius", "label": "Radius", "group": "Shape", "type": "radius" },
    { "property": "--kakao-alert-duration", "label": "Auto-hide", "group": "Motion", "type": "duration", "hint": "info and success only" },
    { "property": "--kakao-alert-fade-duration", "label": "Fade out", "group": "Motion", "type": "duration" },
    { "property": "--kakao-alert-ease", "label": "Easing", "group": "Motion", "type": "easing" }
  ]
  </script>
</main>
</body>
</html>
