<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-action-bar - Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<script src="../button/button.js" defer></script>
<script src="action-bar.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<style>
  /* The preview bars rest in their frame: a page-coloured strip, like the page under a floating bar. */
  .bar-stage { padding: 1.5rem 0; border-radius: 10px; background: var(--kakao-color-page, #f6f7f9); }
  .bar-stage kakao-action-bar { position: relative; bottom: auto; top: auto; z-index: auto; }
</style>
<script src="../header-bar/header-bar.js" defer></script>
</head>
<body>
<kakao-header-bar>
  <kakao-theme-switch slot="end"></kakao-theme-switch>
</kakao-header-bar>
<main data-construction data-target="action-bar" data-source="action-bar.js" data-title="Action bar">
  <div class="construction-preview">
    <figure>
      <figcaption>Summary and md buttons</figcaption>
      <div class="bar-stage">
        <kakao-action-bar label="Preview actions">
          3 marked to fix
          <kakao-button slot="actions" label="Show list" variant="secondary"></kakao-button>
          <kakao-button slot="actions" label="Copy"></kakao-button>
        </kakao-action-bar>
      </div>
    </figure>
    <figure>
      <figcaption>Small buttons, a ghost action</figcaption>
      <div class="bar-stage">
        <kakao-action-bar label="Preview actions, small" size="sm">
          12 files selected
          <kakao-button slot="actions" label="Clear" variant="ghost" size="sm"></kakao-button>
          <kakao-button slot="actions" label="Move" variant="secondary" size="sm"></kakao-button>
          <kakao-button slot="actions" label="Delete" variant="danger" size="sm"></kakao-button>
        </kakao-action-bar>
      </div>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-action-bar-bg", "label": "Background", "group": "Colour", "type": "color" },
    { "property": "--kakao-action-bar-text", "label": "Text", "group": "Colour", "type": "color" },
    { "property": "--kakao-action-bar-shadow", "label": "Shadow", "group": "Shape", "type": "shadow", "hint": "elevation level 3 (overlay); the ring stands in for a border" },
    { "property": "--kakao-action-bar-font-size", "label": "Font size", "group": "Typography", "type": "length", "units": ["rem", "px", "em"] },
    { "property": "--kakao-action-bar-summary-weight", "label": "Summary weight", "group": "Typography", "type": "number", "min": 100, "max": 900, "step": 100 },
    { "property": "--kakao-action-bar-radius", "label": "Radius", "group": "Shape", "type": "radius", "hint": "md button radius + padding, so the corners are concentric" },
    { "property": "--kakao-action-bar-radius-sm", "label": "Radius (sm)", "group": "Shape", "type": "radius", "hint": "sm button radius + padding" },
    { "property": "--kakao-action-bar-padding", "label": "Padding", "group": "Size & spacing", "type": "length", "units": ["px", "rem"] },
    { "property": "--kakao-action-bar-summary-padding-x", "label": "Summary inset", "group": "Size & spacing", "type": "length", "units": ["rem", "px", "em"], "hint": "extra space before the summary" },
    { "property": "--kakao-action-bar-gap", "label": "Actions gap", "group": "Size & spacing", "type": "length", "units": ["rem", "px", "em"], "hint": "between actions, and between wrapped rows" },
    { "property": "--kakao-action-bar-summary-gap", "label": "Summary gap", "group": "Size & spacing", "type": "length", "units": ["rem", "px", "em"], "hint": "between the summary and the actions" },
    { "property": "--kakao-action-bar-min-height", "label": "Minimum height", "group": "Size & spacing", "type": "length", "units": ["px", "rem"] },
    { "property": "--kakao-action-bar-min-height-sm", "label": "Minimum height (sm)", "group": "Size & spacing", "type": "length", "units": ["px", "rem"], "hint": "sm button height + 2 × padding" },
    { "property": "--kakao-action-bar-min-width", "label": "Minimum width", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-action-bar-max-width", "label": "Maximum width", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-action-bar-gutter", "label": "Distance from the edge", "group": "Size & spacing", "type": "length", "units": ["rem", "px"], "hint": "to the screen or scroll edge; none on phones when fixed" },
    { "property": "--kakao-action-bar-z-index", "label": "Z-index", "group": "Layer", "type": "number", "min": 0, "max": 1000, "step": 1, "hint": "above the header bar (30), below toasts (70)" },
    { "property": "--kakao-action-bar-duration", "label": "Slide duration", "group": "Motion", "type": "duration" },
    { "property": "--kakao-action-bar-ease", "label": "Easing", "group": "Motion", "type": "easing" }
  ]
  </script>
</main>
</body>
</html>
