<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kakao-grid - Construction</title>
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/font.css" />
<link rel="stylesheet" href="../../shared/themes.css" />
<script src="../../shared/component-api.js"></script>
<script src="../../shared/page-cloak.js"></script>
<script src="../../components/theme-switch/theme-switch.js"></script>
<link rel="stylesheet" href="../../shared/construction.css" />
<link rel="stylesheet" href="../button/button.css" />
<link rel="stylesheet" href="grid.css" />
<script src="../button/button.js" defer></script>
<script src="grid.js" defer></script>
<script src="../card/card.js" defer></script>
<script src="../../shared/construction.js" defer></script>
<script src="../header-bar/header-bar.js" defer></script>
</head>
<body>
<kakao-header-bar>
  <kakao-theme-switch slot="end"></kakao-theme-switch>
</kakao-header-bar>
<main data-construction data-target="grid" data-source="grid.css" data-title="Grid">
  <div class="construction-preview">
    <figure>
      <figcaption>Default: min md, gap md</figcaption>
      <kakao-grid>
        <kakao-card><h3 slot="header">Build</h3><p>Passed in 2 min 14 s.</p></kakao-card>
        <kakao-card><h3 slot="header">Tests</h3><p>103 passed, 2 skipped.</p></kakao-card>
        <kakao-card><h3 slot="header">Deploy</h3><p>Waiting for review.</p></kakao-card>
      </kakao-grid>
    </figure>
    <figure>
      <figcaption>min sm, gap sm</figcaption>
      <kakao-grid min="sm" gap="sm">
        <kakao-card><p>Open 24</p></kakao-card>
        <kakao-card><p>In review 7</p></kakao-card>
        <kakao-card><p>Merged 131</p></kakao-card>
        <kakao-card><p>Closed 12</p></kakao-card>
      </kakao-grid>
    </figure>
    <figure>
      <figcaption>min lg, gap lg</figcaption>
      <kakao-grid min="lg" gap="lg">
        <kakao-card><p>Summary</p></kakao-card>
        <kakao-card><p>Details</p></kakao-card>
      </kakao-grid>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-grid-min", "label": "Column min (md)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"], "hint": "the narrowest a column gets" },
    { "property": "--kakao-grid-min-sm", "label": "Column min (sm)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-grid-min-lg", "label": "Column min (lg)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-grid-gap", "label": "Gap (md)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-grid-gap-sm", "label": "Gap (sm)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] },
    { "property": "--kakao-grid-gap-lg", "label": "Gap (lg)", "group": "Size & spacing", "type": "length", "units": ["rem", "px"] }
  ]
  </script>
</main>
</body>
</html>
