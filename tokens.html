<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Main variables - Construction</title>
<link rel="stylesheet" href="shared/kakao.css" />
<script src="shared/kakao.js"></script>
<script src="shared/page-cloak.js"></script>
<link rel="stylesheet" href="shared/construction.css" />
<script src="shared/construction.js" defer data-page-transition-script></script>
<link rel="stylesheet" href="shared/vendor/fontawesome/css/all.min.css" />
<link rel="stylesheet" href="shared/site-shell.css" />
<script src="shared/settings-dialog.js" defer></script>
<script src="shared/page-transition.js"></script>
<script src="shared/site-nav.js"></script>
</head>
<body>
<kakao-header-bar nav-label="Pages" data-page-transition>
  <!-- The site's shell: it stays while the pages swap their <main> (shared/page-transition.js).
       The start slot is a region too: the kitchen sink puts its section menu there. -->
  <span slot="start" data-page-transition-content="bar-start"></span>
  <a slot="nav" href="index.html" data-text="Home">Home</a>
  <a slot="nav" href="components.html" data-text="Components">Components</a>
  <button slot="nav" type="button" id="site-examples" class="site-nav-menu"><span data-text="Examples">Examples</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <kakao-menu slot="nav" for="site-examples" label="Examples" data-site-examples></kakao-menu>
  <a slot="nav" href="styleguide.html" data-text="Style guide">Style guide</a>
  <a slot="nav" href="tokens.html" aria-current="page" data-text="Main variables">Main variables</a>
  <a slot="nav" href="changelog.html" data-text="Changelog">Changelog</a>
  <kakao-button slot="end" class="page-theme-menu" theme-picker label="Theme" variant="secondary" size="sm" show-selected
    list-data='[{"value":"light","label":"Light"},{"value":"beige","label":"Beige"},{"value":"umber","label":"Umber"},{"value":"dark","label":"Dark"},{"value":"amoled","label":"AMOLED"},{"value":"catppuccin","label":"Catppuccin"},{"value":"forest","label":"Forest"}]'></kakao-button>
  <button slot="end" type="button" class="page-icon-link" data-settings-open aria-haspopup="dialog" title="Settings" aria-label="Settings"><i class="fas fa-gear" aria-hidden="true"></i></button>
</kakao-header-bar>
<main data-page-transition-content="content" tabindex="-1" data-construction data-target="tokens" data-source="shared/tokens.css" data-title="Main variables">
  <div class="construction-preview">
    <figure>
      <figcaption>Buttons</figcaption>
      <kakao-button label="Primary"></kakao-button>
      <kakao-button label="Secondary" variant="secondary"></kakao-button>
      <kakao-button label="Delete" variant="danger"></kakao-button>
    </figure>
    <figure>
      <figcaption>Tabs</figcaption>
      <kakao-tabs>
        <kakao-tab selected>Plan</kakao-tab>
        <kakao-tab>Playback</kakao-tab>
        <kakao-tab>Account</kakao-tab>
      </kakao-tabs>
    </figure>
    <figure>
      <figcaption>Switches</figcaption>
      <kakao-switch-group label="Notifications" color-labels
        list-data='[{"name":"email","label":"Email","checked":true},{"name":"sms","label":"SMS"}]'></kakao-switch-group>
    </figure>
    <figure>
      <figcaption>Step switch</figcaption>
      <kakao-step-switch label="Quality" value="med"
        list-data='[{"value":"low","label":"Low"},{"value":"med","label":"Medium"},{"value":"high","label":"High"}]'></kakao-step-switch>
    </figure>
    <figure>
      <figcaption>Slider · number input</figcaption>
      <kakao-slider min="0" max="100" value="40" unit="%" label="Volume"></kakao-slider>
    </figure>
    <figure>
      <figcaption>Multi dropdown</figcaption>
      <kakao-multi-dropdown type="date" label="Date of birth" allow-unknown="day,month" value="00.00.1990"></kakao-multi-dropdown>
    </figure>
    <figure>
      <figcaption>File upload</figcaption>
      <kakao-file-upload label="Attachments"></kakao-file-upload>
    </figure>
  </div>

  <script type="application/json" class="construction-manifest">
  [
    { "property": "--kakao-color-primary", "label": "Accent (state)", "group": "Colour", "type": "color", "hint": "on, selected, filled" },
    { "property": "--kakao-color-text", "label": "Text", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-text-soft", "label": "Soft text", "group": "Colour", "type": "color", "hint": "secondary text, ghost button" },
    { "property": "--kakao-color-muted", "label": "Muted text", "group": "Colour", "type": "color", "hint": "placeholders, captions; 4.5:1" },
    { "property": "--kakao-color-page", "label": "Page", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-bg", "label": "Surface", "group": "Colour", "type": "color", "hint": "fields, lists, popovers" },
    { "property": "--kakao-color-raised", "label": "Raised", "group": "Colour", "type": "color", "hint": "tab thumb, pressed segment" },
    { "property": "--kakao-color-field-border", "label": "Field edge", "group": "Colour", "type": "color", "hint": "field borders" },
    { "property": "--kakao-color-subtle", "label": "Subtle fill", "group": "Colour", "type": "color", "hint": "secondary button, hover" },
    { "property": "--kakao-color-subtle-strong", "label": "Subtle fill, strong", "group": "Colour", "type": "color", "hint": "pressed, selected row, track" },
    { "property": "--kakao-color-line", "label": "Hairline", "group": "Colour", "type": "color", "hint": "decorative dividers" },
    { "property": "--kakao-color-border", "label": "Control border", "group": "Colour", "type": "color", "hint": "field edges, off track; 3:1" },
    { "property": "--kakao-color-ink", "label": "Ink (actions)", "group": "Colour", "type": "color", "hint": "primary button" },
    { "property": "--kakao-color-ink-hover", "label": "Ink hover", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-on-ink", "label": "Text on ink", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-danger", "label": "Danger", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-danger-hover", "label": "Danger hover", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-on-danger", "label": "Text on danger", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-success", "label": "Success", "group": "Colour", "type": "color" },
    { "property": "--kakao-color-warning", "label": "Warning", "group": "Colour", "type": "color", "hint": "warning alerts; 4.5:1 on surface" },
    { "property": "--kakao-color-focus", "label": "Focus ring", "group": "Colour", "type": "color" },
    { "property": "--kakao-space-x", "label": "Padding x", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-space-y", "label": "Padding y", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-space-gap", "label": "Gap", "group": "Size & spacing", "type": "length" },
    { "property": "--kakao-space-below-bar", "label": "Below the page bar", "group": "Size & spacing", "type": "length", "hint": "page bar to first content" },
    { "property": "--kakao-scroll-fade", "label": "Scroll edge fade", "group": "Size & spacing", "type": "length", "hint": "sideways scrollers with more to scroll" },
    { "property": "--kakao-radius-xs", "label": "Radius xs", "group": "Shape", "type": "length", "hint": "ticks, small chips" },
    { "property": "--kakao-radius-sm", "label": "Radius sm", "group": "Shape", "type": "length", "hint": "options, tab thumb, small inputs" },
    { "property": "--kakao-radius-md", "label": "Radius md", "group": "Shape", "type": "length", "hint": "fields, menus, tab track" },
    { "property": "--kakao-radius-lg", "label": "Radius lg", "group": "Shape", "type": "length", "hint": "cards, drop zone, segments" },
    { "property": "--kakao-radius-pill", "label": "Radius pill", "group": "Shape", "type": "length", "hint": "switch tracks, badges" },
    { "property": "--kakao-font-family", "label": "Font family", "group": "Typography", "type": "font-family" },
    { "property": "--kakao-font-mono", "label": "Monospace font", "group": "Typography", "type": "font-family", "hint": "code, logs, file:line" },
    { "property": "--kakao-font-size", "label": "Font size", "group": "Typography", "type": "length" },
    { "property": "--kakao-motion-duration", "label": "Motion duration", "group": "Motion", "type": "duration" },
    { "property": "--kakao-ease-standard", "label": "Standard easing", "group": "Motion", "type": "easing", "hint": "fades, colour, things that don't settle" },
    { "property": "--kakao-ease-spring", "label": "Spring easing", "group": "Motion", "type": "easing", "hint": "moves into place along a line" }
  ]
  </script>
</main>
</body>
</html>
