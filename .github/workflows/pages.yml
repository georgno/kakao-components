name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only publish the demo pages and what they load; archive/, openspec/
      # and tools/ stay in the repo but off the site.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html components.html kitchen-sink.html tokens.html styleguide.html settings.html changelog.html CHANGELOG.md components shared _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
