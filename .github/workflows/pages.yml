name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The style checker (tools/style-check.js) checks every kakao placement
      # against the styleguide's rules; an error stops the deploy.
      - name: Style check
        run: node tools/style-check.js

      # tokens.json (tools/export-tokens.js) must match the design sources;
      # the pre-commit hook keeps it current, this catches a skipped hook.
      - name: Token export up to date
        run: node tools/export-tokens.js --check

      # custom-elements.json (tools/manifest.js) must match the component headers.
      - name: Manifest up to date
        run: node tools/manifest.js --check

      # CATALOG.md's component list (tools/catalog.js) must match the manifest.
      - name: Catalog up to date
        run: node tools/catalog.js --check

      # shared/kakao.css and the loader's map (tools/loader.js) must match
      # tokens, font, themes and custom-elements.json.
      - name: Loader up to date
        run: node tools/loader.js --check

      # .claude/skills and .pi/skills hold copies of skills/ (tools/skills.js).
      - name: Skill copies up to date
        run: node tools/skills.js --check

      # Only publish the demo pages and what they load; archive/, openspec/
      # and tools/ stay in the repo but off the site.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html components.html kitchen-sink.html tokens.html styleguide.html changelog.html CHANGELOG.md CATALOG.md tokens.json custom-elements.json components shared templates recipes skills _site/

      # Minify the copy (never the repo): no comments or extra whitespace in
      # HTML, JS and CSS. The minifiers are installed for this run only; the
      # repo keeps no package.json. Settings blocks survive line for line.
      - name: Minify site
        run: |
          npm install --no-save --no-package-lock html-minifier-terser@7.2.0 terser@5.51.2 clean-css@5.3.3
          node tools/minify-site.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
