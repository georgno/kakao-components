<kakao-dialog label="Right (default)">
  <div slot="footer">
    <kakao-button label="Cancel" variant="ghost"></kakao-button>
    <kakao-button label="Save"></kakao-button>
  </div>
</kakao-dialog>
<kakao-dialog label="Left" button-position="left">
  <kakao-button slot="footer" label="Delete" variant="danger"></kakao-button>
  <kakao-button slot="footer" label="Keep" variant="secondary"></kakao-button>
</kakao-dialog>
<kakao-dialog label="Centred" button-position="center">
  <div slot="footer">
    <kakao-button label="Later" variant="ghost"></kakao-button>
    <kakao-button label="Update" variant="primary"></kakao-button>
  </div>
</kakao-dialog>
<kakao-dialog label="Full width" full-width button-position="left">
  <div slot="footer">
    <kakao-button label="Keep it" variant="secondary"></kakao-button>
    <kakao-button label="Delete" variant="danger"></kakao-button>
  </div>
</kakao-dialog>
<kakao-dialog label="One button">
  <div slot="footer"><kakao-button label="OK"></kakao-button></div>
</kakao-dialog>
